# ============================================================
# 名称: reject-drop
# 更新: 2026-11-03
# 类型: classical / REJECT-DROP
# 说明: 后台日志、监控、遥测、推送长连接等会被拒绝后反复重连的域名，
#       用丢弃让对方等超时，降低重试频率。
#       广告类（开屏、信息流）不放这里，放 REJECT 规则集。
# 依赖: DOMAIN-WILDCARD 需要较新的 mihomo 内核，且假设 * 可以跨越 .
# 注意: 推送组封了会收不到离线通知；log.* / logs.* / mon.* 范围较宽
# ============================================================
