# ============================================================
# 名称: reject-drop
# 更新: 2026-11-18
# 类型: classical / REJECT-DROP
# 说明: 后台日志、监控、遥测、推送长连接等会被拒绝后反复重连的域名，
#       用丢弃让对方等超时，降低重试频率。
#       广告类（开屏、信息流）不放这里，放 custom-reject（REJECT）规则集；
#       两个规则集内容互斥，本文件里的域名也不要放进 DNS 层的 custom-dom-reject
#       （DNS 直接拒绝会让客户端更快重试，等于绕过了 DROP）。
# 依赖: DOMAIN-WILDCARD 需要较新的 mihomo 内核，且假设 * 可以跨越 .
# 注意: 推送组封了会收不到离线通知；analytics.* / log.* / logs.* / mon.* /
#       telemetry.* 范围较宽，会命中 analytics.google.com、公司内网的
#       log.xxx / mon.xxx 等；DROP 是挂起到超时，误伤时比 REJECT 更难察觉，
#       需要放行的域名请在规则里排到本规则集之前（内网 / 私网直连也放前面）
# ============================================================
payload:
  # ===== 字节系：日志 / 监控（命中最高）=====
  # mssdk / tnc / polaris / saveu 是风控和路由配置，字节系 App 登录 / 风控异常时先查这几条
  - DOMAIN-WILDCARD,log*-misc-*.amemv.com
  - DOMAIN-WILDCARD,log*-misc-*.zijieapi.com
  - DOMAIN-WILDCARD,log*-misc-*.fqnovel.com
  - DOMAIN-WILDCARD,mon*-misc-*.amemv.com
  - DOMAIN-WILDCARD,mon*-misc-*.zijieapi.com
  - DOMAIN-WILDCARD,mon*-misc-*.fqnovel.com
  - DOMAIN-WILDCARD,rtlog*-*.zijieapi.com
  - DOMAIN-WILDCARD,rtlog*-*.amemv.com
  - DOMAIN-WILDCARD,*-applog-*.zijieapi.com
  - DOMAIN-WILDCARD,*-applog-*.amemv.com
  - DOMAIN-WILDCARD,*-applog-*.fqnovel.com
  - DOMAIN-WILDCARD,abtest*-misc-*.zijieapi.com
  - DOMAIN-WILDCARD,abtest*-misc-*.amemv.com
  - DOMAIN-WILDCARD,abtest*-misc-*.fqnovel.com
  - DOMAIN-WILDCARD,mssdk*-normal-*.zijieapi.com
  - DOMAIN-WILDCARD,polaris*-normal-*.zijieapi.com
  - DOMAIN-WILDCARD,saveu*-normal-*.zijieapi.com
  - DOMAIN-WILDCARD,tnc*-*.zijieapi.com
  - DOMAIN-WILDCARD,tnc*-*.bytedance.com
  - DOMAIN-WILDCARD,*-analytics.bytescm.com
  - DOMAIN-SUFFIX,ctobsnssdk.com
  - DOMAIN,logbk.amemv.com
  - DOMAIN,timon.zijieapi.com
  - DOMAIN,vcs.zijieapi.com
  - DOMAIN,feedback-c.zijieapi.com
  - DOMAIN,live-player-log-service.bytedance.com
  - DOMAIN,dm.bytedance.com
  - DOMAIN,dm.toutiao.com
  - DOMAIN,dm-hl.toutiao.com
  - DOMAIN,monsetting.toutiao.com
  - DOMAIN,abtest-ch.snssdk.com
  - DOMAIN,mssdk.volces.com
  # 以下是推断的节点，没匹配到域名时无副作用
  - DOMAIN-WILDCARD,mcs*.zijieapi.com
  - DOMAIN-WILDCARD,crash*.zijieapi.com
  - DOMAIN-WILDCARD,slardar*.zijieapi.com
  - DOMAIN-WILDCARD,apm*.volces.com
  - DOMAIN-REGEX,^ads.-normal\.zijieapi\.com

  # ===== 通用日志 / 监控前缀 =====
  - DOMAIN-WILDCARD,applog.*
  - DOMAIN-WILDCARD,analytics.*
  - DOMAIN-REGEX,^logs?\..+$
  - DOMAIN-WILDCARD,mon.*
  - DOMAIN-WILDCARD,rtlog*.*
  # 遥测（含 telemetry.microsoft.com、incoming.telemetry.mozilla.org 等）
  - DOMAIN-WILDCARD,telemetry.*
  - DOMAIN-WILDCARD,*.telemetry.*

  # ===== 小红书（新增，你的命中第 3、6、11 名）=====
  - DOMAIN-WILDCARD,apm-*.xiaohongshu.com
  - DOMAIN,t2.xiaohongshu.com
  - DOMAIN,lng.xiaohongshu.com
  - DOMAIN,spider-tracker.xiaohongshu.com
  - DOMAIN,crash.xiaohongshu.com

  # ===== 微软遥测 =====
  - DOMAIN-SUFFIX,events.data.microsoft.com
  - DOMAIN-WILDCARD,vortex*.data.microsoft.com
  - DOMAIN-SUFFIX,pipe.aria.microsoft.com
  # Application Insights，自己开发并使用的要注释掉
  - DOMAIN-SUFFIX,applicationinsights.microsoft.com
  - DOMAIN,watson.microsoft.com
  - DOMAIN,in.appcenter.ms

  # ===== 其他应用遥测（新增）=====
  - DOMAIN,ecsv2.roblox.com
  - DOMAIN,tracing.roblox.com
  # 补回，logs.* 覆盖不到带前缀的子域名
  - DOMAIN-SUFFIX,logs.netflix.com
  - DOMAIN,dataflow.biliapi.com
  - DOMAIN,report.voovmeeting.com
  - DOMAIN,dw-online.ksosoft.com
  - DOMAIN-SUFFIX,lnk0.com
  - DOMAIN,receiver.habby.mobi
  # 观测云 RUM / 数据上报；自己用观测云控制台的要注释掉
  - DOMAIN-SUFFIX,guance.com
  # 墨迹天气日志
  - DOMAIN-WILDCARD,v*log.moweather.com
  # Firebase 统计
  - DOMAIN-SUFFIX,app-measurement.com

  # ===== 推送长连接（断线后客户端会反复重连，封了收不到离线通知）=====
  - DOMAIN-SUFFIX,jpush.cn
  - DOMAIN-SUFFIX,jpush.io
  # 极光认证（一键登录）、官网和控制台也用 jiguang.cn，DROP 会让一键登录卡到超时，默认不启用
  # - DOMAIN-SUFFIX,jiguang.cn
  - DOMAIN-SUFFIX,gepush.com
  - DOMAIN-SUFFIX,getui.com
  - DOMAIN-SUFFIX,getui.net
  - DOMAIN-SUFFIX,igexin.com
  - DOMAIN,push.ksapisrv.com
  # - DOMAIN-SUFFIX,onesignal.com

  # ===== 友盟 / 阿里日志 =====
  - DOMAIN-SUFFIX,umeng.com
  - DOMAIN-SUFFIX,umengcloud.com
  - DOMAIN-SUFFIX,umengcloud.net
  # 阿里云日志服务数据面，自己用 SLS 的要注释掉
  - DOMAIN-SUFFIX,log.aliyuncs.com
  - DOMAIN,mpaas-loggw4zwy.aliyuncs.com
  - DOMAIN,loggw-ex.alipay.com
  - DOMAIN-WILDCARD,mdap.alipay.*
  # ===== 百度 =====
  - DOMAIN,h2tcbox.baidu.com
  - DOMAIN,ecmb.bdimg.com

  # ===== 候选（默认不生效，看命中次数再启用）=====
