# ==========================================================================
# adblock_daily.yaml  mihomo 规则集 · behavior: domain · 408 条
#
# 是什么  408 条后缀，来自你自己的抓包：每个命中过的广告地址
#         都塌缩成能覆盖它的最短后缀。
#         盲区：只包含已经被旧规则拦下的流量，全新广告网络要先抓一次才进来。
#
# 怎么用  mihomo 配置里加：
#           rule-providers:
#             ads-daily:
#               type: file            # 或 http + url + interval
#               behavior: domain      # 后缀规则，匹配最省
#               format: yaml
#               path: ./ruleset/adblock_daily.yaml
#           rules:
#             - RULE-SET,ads-daily,REJECT
#         Surge / Shadowrocket 用同目录的 adblock_daily.list 当 RULE-SET。
#
# 配套   同时加载 adblock_general.yaml。
# 更新   interval: 86400；每次抓包后把日志丢进 ./custom/ 再跑 python3 build.py
# 换档   发现广告又回来了，把本 provider 的路径改成 adblock_full.yaml 即可，
#         两者格式相同，可直接互换
