# ============================================================
# 名称: reject
# 更新: 2026-11-18
# 类型: classical / REJECT
# 说明: 广告联盟、广告平台、海外归因/分析 SDK、各厂商广告域名，
#       请求秒失败，避免开屏和信息流卡在超时上。
#       后台日志 / 监控 / 遥测 / 推送长连接放 custom-reject-drop（REJECT-DROP），
#       两个规则集内容互斥、不要重复；日志监控类按命中次数逐步迁过去。
# 依赖: DOMAIN-KEYWORD / DOMAIN-WILDCARD 无法同步到 AdGuard，
#       纯域名部分（DOMAIN / DOMAIN-SUFFIX）单独给 AdGuard 用
# 注意: 游戏广告 SDK 封了看广告领奖励会失效；观察区默认不生效。
#       DOMAIN-KEYWORD 是子串匹配，新增前先想想会不会撞上正常单词
#       （例如 openx 会命中 openxmlformats），能写成后缀就写后缀。
#       ads.* 会命中 ads.google.com 等广告主后台，需要访问时在规则里先放行。
# 结构: 一 IP / 二 通用规则 / 三 通用 SDK 与统计 / 四 推送（已迁到 drop）/
#       五 广告联盟与平台 / 六 游戏广告 / 七 海外归因分析 /
#       八 Google / 九 厂商与应用 / 十 观察区
# ============================================================
