# Custom DNS reject domain rules for Mihomo
# 更新: 2026-11-18
# 说明: 用于 nameserver-policy 的 DNS 层拒绝域名（behavior: domain / format: yaml）。
#       内容 = custom-reject 里能用 domain 表达的部分 + 少量只在 DNS 层拦的广告域名。
#       不含 custom-reject-drop 里的日志 / 监控 / 遥测 / 推送域名：
#       DNS 直接拒绝会让客户端更快重试，等于绕过 REJECT-DROP。
# +.domain 匹配主域名及其所有子域名；只在父级后缀不合适时才保留精确域名。
# DOMAIN-KEYWORD / DOMAIN-WILDCARD / DOMAIN-REGEX 无法在这里表达。
# 注意: fake-ip 模式下不在 fake-ip-filter 里的域名不会走 nameserver-policy，
#       这里的条目对它们不生效，实际拦截靠 custom-reject 规则集。
